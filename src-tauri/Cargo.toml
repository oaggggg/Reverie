[package]
name = "app"
version = "1.1.3"
description = "Reverie — 一款音乐播放器"
authors = ["Tenth-G"]
license = "GPL-3.0"
repository = "https://github.com/oaggggg/Reverie"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
port_check = "0.2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
