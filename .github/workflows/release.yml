name: Release

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to build, for example v1.1.3"
        required: true
        type: string
      release_draft:
        description: "Create a draft release instead of publishing immediately"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.name }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            rust_targets: x86_64-pc-windows-msvc
            build_args: ""
            sidecar_target: win32-x64
            asset_pattern: Reverie_[version]_Windows_[arch][_setup][ext]
          - name: macOS Universal
            platform: macos-latest
            rust_targets: x86_64-apple-darwin,aarch64-apple-darwin
            build_args: --target universal-apple-darwin
            sidecar_target: darwin-universal
            asset_pattern: Reverie_[version]_macOS_[arch][ext]
    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag_name || github.ref }}

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '$tag' is not a valid vX.Y.Z tag." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.name }}

      - name: Install dependencies
        run: npm ci

      - name: Validate release version
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: npm run validate:release

      - name: Verify project
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build target sidecar
        env:
          REVERIE_SIDECAR_TARGET: ${{ matrix.sidecar_target }}
        run: npm run prepare:sidecar

      - name: Verify updater integrity key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            echo "Missing TAURI_SIGNING_PRIVATE_KEY repository secret." >&2
            exit 1
          fi

      - name: Build and publish GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          REVERIE_SIDECAR_TARGET: ${{ matrix.sidecar_target }}
        with:
          tagName: ${{ steps.release.outputs.tag }}
          releaseName: "Reverie __VERSION__"
          releaseBody: |
            ## Reverie __VERSION__

            ### 本次更新
            - 全面优化桌面端性能、动画反馈和高频交互体验。
            - 播放器在窗口失焦或隐藏时主动降低渲染开销。
            - macOS 使用原生交通灯、Overlay 标题栏和系统化交互布局。
            - Windows 与 macOS 共享同一套自动更新与发布流程。

            ### 下载说明
            - Windows：下载 NSIS 安装程序。
            - macOS：下载 Universal DMG，同时支持 Intel 与 Apple 芯片。
            - 两个平台均未进行操作系统代码签名；首次运行时可能出现系统安全提示。
          releaseDraft: ${{ inputs.release_draft || false }}
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.build_args }}
          assetNamePattern: ${{ matrix.asset_pattern }}

  finalize-updater:
    name: Finalize updater metadata
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Resolve release tag
        id: release
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          tag="${INPUT_TAG:-$REF_NAME}"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Release tag '$tag' is not a valid vX.Y.Z tag." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Align macOS updater asset names
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { owner, repo } = context.repo;
            const tag = process.env.RELEASE_TAG;
            // getReleaseByTag 对 draft release 返回 404，必须走列表接口。
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner, repo, per_page: 100 },
            );
            const release = releases.find((item) => item.tag_name === tag);

            if (!release) {
              core.setFailed(`Release ${tag} not found`);
              return;
            }
            const rel = release.data ?? release;
            const assets = rel.assets;
            const latestAsset = assets.find((asset) => asset.name === "latest.json");

            if (!latestAsset) {
              core.setFailed(`Release ${tag} is missing latest.json`);
              return;
            }

            const latestResponse = await github.request(
              "GET /repos/{owner}/{repo}/releases/assets/{asset_id}",
              {
                owner,
                repo,
                asset_id: latestAsset.id,
                headers: { accept: "application/octet-stream" },
              },
            );
            const latest = JSON.parse(Buffer.from(latestResponse.data).toString("utf8"));
            const archiveName = `Reverie_${latest.version}_macOS_universal.app.tar.gz`;
            const archiveAsset = assets.find((asset) => asset.name === archiveName);
            const signatureAsset = assets.find((asset) => asset.name === `${archiveName}.sig`);

            if (!archiveAsset || !signatureAsset) {
              core.setFailed(`Release ${tag} is missing ${archiveName} or its signature`);
              return;
            }

            const signatureResponse = await github.request(
              "GET /repos/{owner}/{repo}/releases/assets/{asset_id}",
              {
                owner,
                repo,
                asset_id: signatureAsset.id,
                headers: { accept: "application/octet-stream" },
              },
            );
            const signature = Buffer.from(signatureResponse.data).toString("utf8").trim();
            const darwinEntries = Object.entries(latest.platforms).filter(([platform]) =>
              platform.startsWith("darwin-"),
            );

            if (!signature) {
              core.setFailed(`${archiveName}.sig is empty`);
              return;
            }

            if (darwinEntries.length === 0) {
              core.setFailed(`Release ${tag} has no macOS updater platforms`);
              return;
            }

            for (const [, metadata] of darwinEntries) {
              metadata.url = archiveAsset.browser_download_url;
              metadata.signature = signature;
            }

            const data = Buffer.from(`${JSON.stringify(latest, null, 2)}\n`);
            await github.rest.repos.deleteReleaseAsset({
              owner,
              repo,
              asset_id: latestAsset.id,
            });
            await github.rest.repos.uploadReleaseAsset({
              owner,
              repo,
              release_id: rel.id,
              name: "latest.json",
              data,
              headers: {
                "content-type": "application/json",
                "content-length": data.length,
              },
            });
